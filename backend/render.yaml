services:
  - type: web
    name: dash24-backend
    env: python
    region: oregon
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn server:app -c gunicorn.conf.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: EASYECOM_API_URL
        sync: false
      - key: EASYECOM_API_KEY
        sync: false
      - key: EASYECOM_WEBHOOK_SECRET
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: LOG_LEVEL
        value: INFO
      - key: DEBUG
        value: false
      - key: ENABLE_DOCS
        value: false
    healthCheckPath: /health
    autoDeploy: true
